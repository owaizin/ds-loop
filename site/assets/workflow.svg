<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Design System Loop: from source to a retained decision</title><desc id="desc">Inspect source, investigate intent, decide a bounded action, verify behavior, retain the decision. Engine measurements inform project decisions.</desc><rect width="1200" height="320" rx="8" fill="#f5f4ed"/><g fill="#20382d" font-family="Arial,sans-serif"><text x="48" y="62" font-size="27" font-weight="600">A finding starts the investigation.</text><text x="48" y="92" font-size="15" fill="#526257">Engine measurements + your project's conventions</text></g><path d="M68 154H1110" stroke="#a6b09d" fill="none"/><g font-family="Arial,sans-serif" fill="#20382d"><g transform="translate(48 0)"><circle cx="15" cy="154" r="15" fill="#20382d"/><text x="15" y="159" text-anchor="middle" font-size="13" fill="#f5f4ed">1</text><text y="207" font-size="23">Inspect</text><text y="236" font-size="14" fill="#526257">Source + coverage</text></g><g transform="translate(276 0)"><circle cx="15" cy="154" r="15" fill="#20382d"/><text x="15" y="159" text-anchor="middle" font-size="13" fill="#f5f4ed">2</text><text y="207" font-size="23">Investigate</text><text y="236" font-size="14" fill="#526257">Intent + consumers</text></g><g transform="translate(504 0)"><circle cx="15" cy="154" r="15" fill="#deed9b" stroke="#20382d"/><text x="15" y="159" text-anchor="middle" font-size="13">3</text><text y="207" font-size="23">Decide</text><text y="236" font-size="14" fill="#526257">Change or preserve</text></g><g transform="translate(732 0)"><circle cx="15" cy="154" r="15" fill="#20382d"/><text x="15" y="159" text-anchor="middle" font-size="13" fill="#f5f4ed">4</text><text y="207" font-size="23">Verify</text><text y="236" font-size="14" fill="#526257">Audit + behavior</text></g><g transform="translate(960 0)"><circle cx="15" cy="154" r="15" fill="#20382d"/><text x="15" y="159" text-anchor="middle" font-size="13" fill="#f5f4ed">5</text><text y="207" font-size="23">Retain</text><text y="236" font-size="14" fill="#526257">A retrievable decision</text></g></g></svg>
